services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_collector
    # Bind to loopback only — do not expose Postgres on shared/cloud networks.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_collector"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # Bind to loopback only — Redis has no AUTH in local compose.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
