server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index landing.html;

    # Same-origin cabinet: empty API base → relative /auth, /tenants, ...
    # Injected once so pages work without the Node dev-gateway.
    sub_filter_once off;
    sub_filter '</head>' '<script>window.AI_COLLECTOR_API_URL=window.location.origin;</script></head>';
    sub_filter_types text/html;

    location = / {
        return 302 /landing.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets lightly; HTML always revalidated.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Health for the static container itself
    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
