<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Регистрация — ИИ-коллектор</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#17212f;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}a{color:#1268a8}main{max-width:480px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid #d6dee7;border-radius:12px;padding:28px}.field{margin:0 0 14px}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input[type=text],input[type=email],input[type=password]{width:100%;border:1px solid #b8c4cf;border-radius:8px;padding:10px 11px}.field-error{color:#b43a40;font-size:13px;margin:6px 0 0}.form-error{margin:0 0 14px;padding:10px 12px;border-left:4px solid #b43a40;background:#fff1f2;border-radius:6px}.btn{width:100%;border:0;border-radius:8px;background:#1268a8;color:#fff;padding:11px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}p.muted{color:#64748b;font-size:14px}
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Создать аккаунт</h1>
      <p class="muted">Организация и первый пользователь с правом владельца. После регистрации откроется кабинет.</p>
      <form id="registerForm" novalidate>
        <div class="form-error" id="formError" hidden></div>
        <div class="field">
          <label for="organizationName">Название организации</label>
          <input id="organizationName" name="organizationName" type="text" autocomplete="organization" required>
          <p class="field-error" id="organizationNameError" hidden></p>
        </div>
        <div class="field">
          <label for="name">Имя</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
          <p class="field-error" id="nameError" hidden></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <p class="field-error" id="emailError" hidden></p>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <p class="field-error" id="passwordError" hidden></p>
        </div>
        <div class="field">
          <label class="check"><input id="agree" type="checkbox" required> Согласен с <a href="/terms.html">условиями использования</a> и <a href="/privacy.html">политикой конфиденциальности</a></label>
          <p class="field-error" id="agreeError" hidden></p>
        </div>
        <button class="btn" type="submit">Создать аккаунт</button>
      </form>
      <p class="muted">Уже есть аккаунт? <a href="/login.html">Войти</a></p>
    </div>
  </main>
  <script>
    const apiBase = (window.AI_COLLECTOR_API_URL || '').replace(/\/$/, '');
    const showError = (id, message) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.hidden = !message;
      el.textContent = message || '';
    };
    const emailOk = (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    document.getElementById('registerForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const organizationName = document.getElementById('organizationName').value.trim();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const agree = document.getElementById('agree').checked;
      const formError = document.getElementById('formError');
      formError.hidden = true;
      showError('organizationNameError', organizationName ? '' : 'Укажите название организации.');
      showError('nameError', name ? '' : 'Укажите имя.');
      showError('emailError', emailOk(email) ? '' : 'Укажите email.');
      showError('passwordError', password.length >= 8 ? '' : 'Введите пароль не короче 8 символов.');
      showError('agreeError', agree ? '' : 'Нужно согласие с условиями.');
      if (!organizationName || !name || !emailOk(email) || password.length < 8 || !agree) return;
      const button = event.submitter;
      button.disabled = true;
      try {
        const response = await fetch(`${apiBase}/auth/register`, {
          method: 'POST',
          credentials: 'include',
          headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ organizationName, name, email, password })
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          formError.hidden = false;
          formError.textContent = body.error === 'EMAIL_ALREADY_EXISTS'
            ? 'Пользователь с таким email уже зарегистрирован.'
            : (body.message || 'Не удалось создать аккаунт. Проверьте поля и повторите попытку.');
          return;
        }
        window.location.href = '/prototype.html';
      } catch {
        formError.hidden = false;
        formError.textContent = 'Не удалось создать аккаунт. Проверьте подключение и повторите попытку.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
