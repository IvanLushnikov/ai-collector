<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Регистрация — ИИ-коллектор</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f6f8;
      color: #17212f;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    a { color: #1268a8; }

    main {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: #fff;
      border: 1px solid #d6dee7;
      border-radius: 14px;
      padding: 36px 32px 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .card-header {
      margin: 0 0 24px;
    }

    .card-header h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      color: #0f1c2e;
    }

    .card-header p {
      margin: 0;
      font-size: 14px;
      color: #5a6a7e;
      line-height: 1.5;
    }

    .fields-group {
      margin: 0 0 4px;
    }

    .fields-group + .fields-group {
      padding-top: 16px;
      margin-top: 8px;
      border-top: 1px solid #e8edf2;
    }

    .field {
      margin: 0 0 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #2d3f52;
    }

    input[type=text],
    input[type=email],
    input[type=password] {
      width: 100%;
      border: 1px solid #b8c4cf;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.5;
      color: #17212f;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }

    input[type=text]:focus,
    input[type=email]:focus,
    input[type=password]:focus {
      border-color: #1268a8;
      box-shadow: 0 0 0 3px rgba(18,104,168,.15);
    }

    .field-error {
      color: #b43a40;
      font-size: 14px;
      margin: 6px 0 0;
      line-height: 1.4;
    }

    .form-error {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-left: 4px solid #b43a40;
      background: #fff1f2;
      border-radius: 6px;
      font-size: 14px;
      color: #8b1c22;
    }

    .check {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 14px;
      line-height: 1.5;
      color: #3a4f65;
    }

    .check input[type=checkbox] {
      margin-top: 3px;
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #1268a8;
      color: #fff;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: background .15s, transform .1s;
    }

    .btn:hover { background: #0f559a; }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .card-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #5a6a7e;
    }

    @media (max-width: 480px) {
      body { padding: 16px 12px; justify-content: flex-start; padding-top: 24px; }
      .card { padding: 24px 20px 20px; }
      .card-header h1 { font-size: 20px; }
    }

    @media (max-height: 700px) {
      body { justify-content: flex-start; padding-top: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="card-header">
        <h1>Создать аккаунт</h1>
        <p>Зарегистрируйте организацию и станьте её владельцем.</p>
      </div>
      <form id="registerForm" novalidate>
        <div class="form-error" id="formError" hidden></div>
        <div class="fields-group">
          <div class="field">
            <label for="organizationName">Название организации</label>
            <input id="organizationName" name="organizationName" type="text" autocomplete="organization" required>
            <p class="field-error" id="organizationNameError" hidden></p>
          </div>
        </div>
        <div class="fields-group">
          <div class="field">
            <label for="name">Ваше имя</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
            <p class="field-error" id="nameError" hidden></p>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <p class="field-error" id="emailError" hidden></p>
          </div>
          <div class="field">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <p class="field-error" id="passwordError" hidden></p>
          </div>
        </div>
        <div class="fields-group">
          <div class="field">
            <label class="check"><input id="agree" type="checkbox" required> Согласен с <a href="terms.html">условиями использования</a> и <a href="privacy.html">политикой конфиденциальности</a></label>
            <p class="field-error" id="agreeError" hidden></p>
          </div>
        </div>
        <button class="btn" type="submit">Создать аккаунт</button>
      </form>
      <p class="card-footer">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
  </main>
    <script>
    (function () {
      var base = document.createElement('base');
      var path = location.pathname.replace(/\/[^/]*$/, '/');
      base.href = path || '/';
      document.head.insertBefore(base, document.head.firstChild);
    })();
  </script>
  <script>
    const apiBase = (window.AI_COLLECTOR_API_URL || '').replace(/\/$/, '');
    const showError = (id, message) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.hidden = !message;
      el.textContent = message || '';
    };
    const emailOk = (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    document.getElementById('registerForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const organizationName = document.getElementById('organizationName').value.trim();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const agree = document.getElementById('agree').checked;
      const formError = document.getElementById('formError');
      formError.hidden = true;
      showError('organizationNameError', organizationName ? '' : 'Укажите название организации.');
      showError('nameError', name ? '' : 'Укажите имя.');
      showError('emailError', emailOk(email) ? '' : 'Укажите email.');
      showError('passwordError', password.length >= 8 ? '' : 'Введите пароль не короче 8 символов.');
      showError('agreeError', agree ? '' : 'Нужно согласие с условиями.');
      if (!organizationName || !name || !emailOk(email) || password.length < 8 || !agree) return;
      const button = event.submitter;
      button.disabled = true;
      if (!apiBase) {
        window.location.href = 'prototype.html';
        return;
      }
      try {
        const response = await fetch(`${apiBase}/auth/register`, {
          method: 'POST',
          credentials: 'include',
          headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ organizationName, name, email, password })
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          formError.hidden = false;
          formError.textContent = body.error === 'EMAIL_ALREADY_EXISTS'
            ? 'Пользователь с таким email уже зарегистрирован.'
            : (body.message || 'Не удалось создать аккаунт. Проверьте поля и повторите попытку.');
          return;
        }
        window.location.href = 'prototype.html';
      } catch {
        formError.hidden = false;
        formError.textContent = 'Не удалось создать аккаунт. Проверьте подключение и повторите попытку.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
