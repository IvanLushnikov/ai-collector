<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход — ИИ-коллектор</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f6f8;
      color: #17212f;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    a { color: #1268a8; }

    main {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: #fff;
      border: 1px solid #d6dee7;
      border-radius: 14px;
      padding: 36px 32px 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .card-header {
      margin: 0 0 24px;
    }

    .card-header h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      color: #0f1c2e;
    }

    .card-header p {
      margin: 0;
      font-size: 14px;
      color: #5a6a7e;
      line-height: 1.5;
    }

    .field {
      margin: 0 0 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #2d3f52;
    }

    input {
      width: 100%;
      border: 1px solid #b8c4cf;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.5;
      color: #17212f;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }

    input:focus {
      border-color: #1268a8;
      box-shadow: 0 0 0 3px rgba(18,104,168,.15);
    }

    .field-error {
      color: #b43a40;
      font-size: 14px;
      margin: 6px 0 0;
      line-height: 1.4;
    }

    .form-error {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-left: 4px solid #b43a40;
      background: #fff1f2;
      border-radius: 6px;
      font-size: 14px;
      color: #8b1c22;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #1268a8;
      color: #fff;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: background .15s, transform .1s;
    }

    .btn:hover { background: #0f559a; }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .card-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #5a6a7e;
    }

    @media (max-width: 480px) {
      body { padding: 16px 12px; justify-content: flex-start; padding-top: 32px; }
      .card { padding: 24px 20px 20px; }
      .card-header h1 { font-size: 20px; }
    }

    @media (max-height: 600px) {
      body { justify-content: flex-start; padding-top: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="card-header">
        <h1>Вход</h1>
        <p>Войдите, чтобы открыть кабинет организации.</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="form-error" id="formError" hidden></div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <p class="field-error" id="emailError" hidden></p>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <p class="field-error" id="passwordError" hidden></p>
        </div>
        <button class="btn" type="submit">Войти</button>
      </form>
      <p class="card-footer">Нет аккаунта? <a href="register.html">Создать аккаунт</a></p>
    </div>
  </main>
    <script>
    (function () {
      var base = document.createElement('base');
      var path = location.pathname.replace(/\/[^/]*$/, '/');
      base.href = path || '/';
      document.head.insertBefore(base, document.head.firstChild);
    })();
  </script>
  <script>
    const apiBase = (window.AI_COLLECTOR_API_URL || '').replace(/\/$/, '');
    const showError = (id, message) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.hidden = !message;
      el.textContent = message || '';
    };
    const emailOk = (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const formError = document.getElementById('formError');
      formError.hidden = true;
      showError('emailError', emailOk(email) ? '' : 'Укажите email.');
      showError('passwordError', password ? '' : 'Введите пароль.');
      if (!emailOk(email) || !password) return;
      const button = event.submitter;
      button.disabled = true;
      if (!apiBase) {
        window.location.href = 'prototype.html';
        return;
      }
      try {
        const response = await fetch(`${apiBase}/auth/login`, {
          method: 'POST',
          credentials: 'include',
          headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          formError.hidden = false;
          formError.textContent = 'Не удалось войти. Проверьте email и пароль.';
          return;
        }
        window.location.href = 'prototype.html';
      } catch {
        formError.hidden = false;
        formError.textContent = 'Не удалось войти. Проверьте подключение и повторите попытку.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
